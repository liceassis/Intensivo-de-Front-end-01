<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intensivo 05</title>

  <link rel="stylesheet" href="style05.css">
</head>

<body>

  <div class="container">

    <aside>
      
      <nav>
        <a href="#">Início</a>
        <a href="#">Projetos</a>
        <a href="#">Contato</a>
      </nav>
    </aside>

    <header>
      <h1>Intensivo 05</h1>
    </header>

    <main>

      <section class="card">
        <h2>Botão Animado</h2>

        <button class="btn-animado">
          Clique aqui
        </button>
      </section>

      <section class="card">
        <h2>Botões com clip-path</h2>

        <p>
          Formatos diferentes de botões.
        </p>

        <div class="botoes">
          <button class="btn-forma">
            Hexágono
          </button>

          <button class="btn-forma btn-diamante">
            Diamante
          </button>
        </div>
      </section>

      <section class="card">
        <h2>Formulário</h2>

        <form class="formulario">

          <div class="campo">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              placeholder="Digite seu nome"
            >
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="seu@email.com"
            >
          </div>

          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea
              id="mensagem"
              rows="4"
              placeholder="Digite sua mensagem..."
            ></textarea>
          </div>

          <button class="enviar" type="submit">
            Enviar mensagem
          </button>

        </form>
      </section>

    </main>

    <footer>
      <p>© 2026 - Todos os direitos reservados.</p>
    </footer>

  </div>

</body>
</html>
